services:
  - type: web
    name: jobmate-backend
    env: java
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/jobmate-backend-0.1.0.jar
    autoDeploy: true
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        value: change-me-in-render
      - key: DB_PASSWORD
        value: change-me-in-render
