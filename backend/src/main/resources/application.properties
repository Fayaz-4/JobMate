spring.application.name=jobmate-backend
spring.profiles.active=dev

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/jobmate_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Fayaz@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Server Configuration
server.port=8080
server.servlet.context-path=/api






# JWT Configuration
jwt.secret=${JWT_SECRET:jobmate-default-jwt-secret-change-me-please-use-a-longer-key}
jwt.expiration=86400000

# CORS Configuration
server.cors.allowed-origins=http://localhost:5173,http://localhost:3000



# Logging
logging.level.root=INFO
logging.level.com.jobmate.backend=DEBUG



# JSearch API Configuration
jsearch.api.key=${JSEARCH_API_KEY:}
jsearch.base.url=https://api.openwebninja.com/jsearch

# Required for JobFetchService Adzuna integration — fill in with real values locally, do not commit real keys
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}

# Jooble integration intentionally disabled — no API key yet. Add jooble.api.key here once obtained from https://jooble.org/api/about
jooble.api.key=${JOOBLE_API_KEY:}

# Google Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}

# OpenAI GPT-4o API Configuration
openai.api.key=${OPENAI_API_KEY:}

# Vapi API Configuration
vapi.private.key=${VAPI_PRIVATE_KEY:}



remotive.base.url=https://remotive.com/api/remote-jobs
arbeitnow.base.url=https://www.arbeitnow.com/api/job-board-api
himalayas.base.url=https://himalayas.app/jobs/api/search

theirstack.api.key=${THEIRSTACK_API_KEY:}

themuse.api.key=${THEMUSE_API_KEY:}