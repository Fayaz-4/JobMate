spring.application.name=jobmate-backend
spring.profiles.active=dev

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/jobmate_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# JWT Configuration
jwt.secret=${JWT_SECRET:change-me}
jwt.expiration=86400000

# CORS Configuration
server.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.root=INFO
logging.level.com.jobmate.backend=DEBUG

# JSearch API Configuration
jsearch.api.key=${JSEARCH_API_KEY:change-me}
jsearch.base.url=https://api.openwebninja.com/jsearch

# Google Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:change-me}

# OpenAI GPT-4o API Configuration
openai.api.key=${OPENAI_API_KEY:change-me}

# Vapi API Configuration
vapi.private.key=${VAPI_PRIVATE_KEY:change-me}
